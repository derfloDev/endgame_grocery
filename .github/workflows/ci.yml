name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository; upload-artifact uses the runtime token, not repo permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-lint-and-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Validate the production image without migrations, backend startup or database credentials.
  nginx-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t endgame-grocery:nginx-smoke .
      - run: bash docker/smoke-nginx.sh endgame-grocery:nginx-smoke

  # Validate the arm64 production image under QEMU (Raspberry Pi target) without publishing it.
  nginx-smoke-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: docker buildx build --platform linux/arm64 --load -t endgame-grocery:nginx-smoke-arm64 .
      - name: Check architecture and native bcrypt module
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh endgame-grocery:nginx-smoke-arm64 \
            -c 'test "$(uname -m)" = aarch64 && cd /app && node -e "require(\"bcrypt\").hashSync(\"smoke\", 4)"'
      - run: bash docker/smoke-nginx.sh endgame-grocery:nginx-smoke-arm64
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64

  unit-test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-unit-test-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: endgame_grocery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/endgame_grocery_test

  e2e:
    needs: [lint-and-build, unit-test]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: endgame_grocery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create environment file
        run: |
          printf 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/endgame_grocery\nJWT_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef\nPORT=4000\nENABLE_TEST_ROUTES=true\n' > .env
      - name: Run database migrations
        run: npm run migrate
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npm run e2e
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
