gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Access logs must never contain credentials. `$request` and `$request_uri` include the query
# string (JWTs, tickets, verification and reset tokens), so the log format uses the normalised
# `$uri`, which has no arguments. Invite tokens are path segments (`/invite/<token>` in the SPA and
# `/api/invites/<token>` in the API), so those requests are logged with a masked path instead.
map $uri $log_invite_request {
    ~^/(api/)?invites?/ 1;
    default 0;
}

map $uri $log_plain_request {
    ~^/(api/)?invites?/ 0;
    default 1;
}

# The referer is deliberately not logged: browsers send the full URL of the calling page, and mail
# links open pages such as /reset-password?token=<token>, so every asset and API request made from
# them would carry the one-time token in its Referer.
log_format main_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
log_format invite_masked '$remote_addr - $remote_user [$time_local] "$request_method /invites/:token $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout main_noquery if=$log_plain_request;
    access_log /dev/stdout invite_masked if=$log_invite_request;

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
