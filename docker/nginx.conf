# Access logs must never contain credentials. `$request` and `$request_uri` include the query
# string (JWTs, tickets, verification and reset tokens), so the log format uses the normalised
# `$uri`, which has no arguments. Invite tokens are path segments (`/invite/<token>` in the SPA and
# `/api/invites/<token>` in the API), so those requests are logged with a masked path instead.
map $uri $log_invite_request {
    ~^/(api/)?invites?/ 1;
    default 0;
}

map $uri $log_plain_request {
    ~^/(api/)?invites?/ 0;
    default 1;
}

# The referer is deliberately not logged: browsers send the full URL of the calling page, and mail
# links open pages such as /reset-password?token=<token>, so every asset and API request made from
# them would carry the one-time token in its Referer.
log_format main_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
log_format invite_masked '$remote_addr - $remote_user [$time_local] "$request_method /invites/:token $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    # Alpine already sets gzip_vary in HTTP scope; server scope avoids duplicate directives.
    gzip on;
    gzip_vary on;
    # Level 5 compresses noticeably better than nginx's default of 1 for a small CPU cost.
    gzip_comp_level 5;
    # WOFF2 is already compressed, so fonts are deliberately not listed.
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout main_noquery if=$log_plain_request;
    access_log /dev/stdout invite_masked if=$log_invite_request;

    include /etc/nginx/security-headers.conf;

    # Every location below sets its own Cache-Control header. nginx does not inherit add_header
    # into a location that declares one, so each of them repeats the security headers. `expires`
    # is not used: together with an explicit Cache-Control it would send the header twice.

    # Vite content-hashes everything in /assets/, so a changed file always has a new URL.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The service worker script and the app shell must be revalidated on every load, otherwise a
    # cached copy could keep users on an old version (or on chunk names that no longer exist).
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Not content-hashed, so they get a short lifetime: a changed font, icon or manifest reaches
    # users within a day.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
    }

    location ~ ^/icon-[0-9]+\.png$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes are answered with index.html, which must not be cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
