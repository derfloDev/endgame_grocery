# Security headers for every response. nginx does not inherit `add_header` into a location that
# declares its own `add_header`, so this file is included at server level and again in each location
# that sets headers (see nginx.conf). Keep the CSP host list in sync with the README.
#
# Script/connect hosts: the icon model runs in a worker that downloads the model from Hugging Face
# (huggingface.co and its hf.co CDN) and the ONNX runtime from jsDelivr. 'wasm-unsafe-eval' lets
# that runtime compile WebAssembly without allowing eval() of strings. blob: in script-src is
# needed because the worker imports the runtime's loader module through a blob: URL; without it
# Chromium blocks that request (verified against the production build). Inline styles are used by
# the React components, so style-src keeps 'unsafe-inline'; scripts stay free of inline code.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.hf.co https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
